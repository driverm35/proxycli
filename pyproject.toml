[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxycli"
version = "1.0.0"
description = "ProxyCLI — HTTPS reverse proxy, SOCKS5 and HTTP CONNECT on a clean VPS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "driverm35" }]
dependencies = [
    "rich==14.3.4",
    "questionary==2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[project.scripts]
proxycli = "proxycli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
